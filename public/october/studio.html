<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拼好词 · 提示词库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#F5F0E7; --paper:#FBF8F2; --ink:#4A3B2E; --muted:#6F604F; --body:#5E4E3E;
  --accent:#B5523A; --danger:#A0462F; --yellow:#F7E48A; --line:#E1D8C8;
  --shadow:rgba(74,59,46,.22);
  --img:#F9D8E2; --img-dot:#D4537E;
  --vid:#D9EEE2; --vid-dot:#2E8B5E;
  --txt:#DCE6F5; --txt-dot:#3D6FB6;
  --mus:#E9DFF5; --mus-dot:#8058B8;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button,input,textarea,select{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #E2B93B;outline-offset:2px}
input::placeholder,textarea::placeholder{color:#9A8B7A}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mono{font-family:var(--mono)}

.page{padding:40px 48px 120px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:20px}
.eyebrow{font-size:14px;letter-spacing:.2em;color:var(--accent);font-weight:500}
.title{margin:8px 0 10px;font-weight:900;font-size:54px;line-height:1.1}
.sub{margin:0;font-size:17px;color:var(--muted)}
.btn{border:1.5px solid var(--ink);background:var(--paper);cursor:pointer;transition:transform .12s ease}
.btn:hover{transform:translate(-1px,-1px)}
.btn:active{transform:translate(1px,1px)}
.btn-new{min-height:56px;padding:0 28px;border-radius:14px;background:var(--yellow);font-size:19px;font-weight:500;display:inline-flex;align-items:center;gap:10px;box-shadow:4px 4px 0 var(--shadow)}
.btn-sm{min-height:44px;padding:0 18px;border-radius:12px;font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn-sm.primary{background:var(--yellow);box-shadow:3px 3px 0 var(--shadow)}
.btn-sm.danger{color:var(--danger);border-color:var(--danger)}
.btn-ghost{min-height:44px;padding:0 10px;border:none;background:transparent;font-size:15px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn-ghost:hover{color:var(--ink)}

.search{display:flex;align-items:center;gap:14px;padding:0 24px;min-height:64px;border:1.5px solid var(--ink);border-radius:16px;background:var(--paper);box-shadow:4px 4px 0 rgba(74,59,46,.1)}
.search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:18px;color:var(--ink);padding:18px 0}
.kbd{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid #CDBFA8;border-radius:6px;padding:3px 7px;white-space:nowrap}

.tops{position:relative;z-index:1;display:flex;align-items:flex-end;gap:8px}
.top{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 30px;border:1.5px solid var(--ink);border-radius:14px 14px 0 0;margin-bottom:-1.5px;font-size:19px;font-weight:500;cursor:pointer;white-space:nowrap;background:#EDE6D9}
.top .n{font-family:var(--mono);font-size:14px;font-weight:500;opacity:.7}
.top[aria-pressed="true"]{font-weight:700;background:var(--tab);border-bottom-color:var(--tab)}
.panel{border:1.5px solid var(--ink);border-radius:0 16px 16px 16px;background:var(--tab);padding:18px 20px;box-shadow:4px 4px 0 var(--shadow)}
.subs{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.chip{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 22px;border-radius:999px;font-size:18px;white-space:nowrap;box-shadow:3px 3px 0 rgba(74,59,46,.1)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.chip .n{font-size:16px;opacity:.6}
.chip[aria-pressed="true"]{font-weight:700;background:var(--c);box-shadow:4px 4px 0 var(--shadow)}
.chip.zero:not([aria-pressed="true"]){opacity:.7}
.panel-note{font-size:15px;color:var(--muted);line-height:1.7;min-height:52px;display:flex;align-items:center}

.meta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px;color:var(--muted);margin-bottom:16px}
.meta strong{color:var(--ink);font-family:var(--mono)}
.meta .hint{font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:26px}
.empty{border:1.5px dashed #8E7E6B;border-radius:16px;padding:48px 24px;text-align:center;color:var(--muted);font-size:15px;display:flex;flex-direction:column;align-items:center;gap:16px}

.card{position:relative;padding-top:24px;transition:transform .15s ease}
.card:hover{transform:translate(-2px,-2px)}
.ear{position:absolute;top:0;left:20px;z-index:1;height:26px;padding:0 14px;display:flex;align-items:center;background:var(--c);border:1.5px solid var(--ink);border-bottom:none;border-radius:10px 10px 0 0;font-family:var(--mono);font-size:13px;font-weight:800;color:#7A6A58}
.sheet{position:relative;min-height:240px;padding:20px 18px 16px;display:flex;flex-direction:column;gap:10px;background:var(--c);border:1.5px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--shadow)}
.card-title{all:unset;cursor:pointer;font-weight:700;font-size:19px;line-height:1.45}
.card-title::after{content:"";position:absolute;inset:0;border-radius:16px}
.card-title:focus-visible{outline:none}
.card-title:focus-visible::after{outline:3px solid #E2B93B;outline-offset:3px}
.preview{margin:0;font-size:14px;line-height:1.75;color:var(--body);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vars{display:flex;flex-wrap:wrap;gap:6px}
.var{font-size:12px;padding:2px 9px;border:1px dashed #7A6A58;border-radius:999px;background:rgba(255,255,255,.55)}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:12px;border-top:1.5px dashed rgba(74,59,46,.3)}
.foot-meta{display:inline-flex;align-items:center;gap:8px;min-width:0;font-size:13px;color:var(--body)}
.foot-meta span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quick{position:relative;z-index:2;min-height:44px;padding:0 14px;border-radius:12px;font-size:14px;font-weight:500;white-space:nowrap;box-shadow:2px 2px 0 rgba(74,59,46,.2)}
.quick.go{background:var(--yellow)}
.done{background:var(--vid) !important}
.card.sel .sheet{box-shadow:5px 5px 0 var(--ink);border-width:2.5px}
.card.sel{transform:translate(-2px,-2px)}
.ear .fav{color:#D9A21B;margin-left:6px}

/* 项目 */
.project .ear{width:120px;background:#EFE3CB}
.project .sheet{background:var(--paper);min-height:210px;padding:22px 22px 20px}
.project .pdot{width:12px;height:12px;border-radius:50%}
.project .name{font-size:20px;font-weight:700;line-height:1.4}
.project .count{font-size:14px;color:var(--muted)}
.project .open{margin-top:auto;align-self:flex-start;position:relative;z-index:2}
.newproj{margin-top:24px;min-height:236px;border:1.5px dashed #8E7E6B;border-radius:16px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;font-size:18px;font-weight:700}
.proj-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.proj-name{display:flex;align-items:center;gap:12px;font-size:28px;font-weight:900;margin:4px 0 0}
.proj-name .dot{width:14px;height:14px}
.proj-actions{display:flex;flex-wrap:wrap;gap:10px}

/* 弹层通用 */
dialog{color:var(--ink)}
dialog::backdrop{background:rgba(74,59,46,.38)}

/* 档案：双击卡片后出现的叠放纸张 */
dialog.archive{width:100%;height:100%;max-width:100%;max-height:100%;margin:0;padding:56px 24px 72px;border:none;background:transparent;overflow-y:auto}
dialog.archive[open]{display:flex;justify-content:center;align-items:flex-start}
dialog.archive::backdrop{background:rgba(74,59,46,.45)}
.stack{position:relative;width:min(820px,100%);padding-right:58px;margin:auto 0}
dialog.archive[open] .stack{animation:drop .26s cubic-bezier(.2,.8,.3,1)}
@keyframes drop{from{transform:translateY(18px) rotate(.6deg);opacity:0}to{transform:none;opacity:1}}
.paper{background:#FBF9F3;border:1.5px solid var(--ink);border-radius:22px;box-shadow:0 12px 32px rgba(74,59,46,.18)}
.b1{position:absolute;top:84px;left:-26px;right:96px;bottom:-54px;transform:rotate(-1.6deg);z-index:0}
.b1 .stamp{position:absolute;left:34px;bottom:16px;font-size:13px;letter-spacing:.32em;color:#8E847A;font-weight:500}
.b2{position:absolute;top:-12px;left:22%;right:22%;height:120px;transform:rotate(-.9deg);z-index:0}
.peek{position:absolute;top:54px;left:60px;right:0;bottom:30px;transform:rotate(1.5deg);z-index:1}
.peek-tab{position:absolute;top:28px;right:4px;width:48px;min-height:180px;padding:12px 0;border:none;background:transparent;cursor:pointer;writing-mode:vertical-rl;letter-spacing:.32em;font-size:15px;font-weight:700;color:var(--ink);border-radius:12px}
.peek-tab:hover{background:#F1EBDF}
.front{position:relative;z-index:2;padding:40px 46px 38px;transform:rotate(-.5deg);display:flex;flex-direction:column;gap:20px}
.front.swap{animation:swap .24s ease-out}
@keyframes swap{from{transform:translateX(26px) rotate(.8deg);opacity:.4}to{transform:rotate(-.5deg);opacity:1}}
.clip{position:absolute;top:-34px;left:128px;width:30px;height:66px;pointer-events:none}
.tape{position:absolute;top:-18px;right:112px;width:200px;height:42px;background:rgba(160,192,232,.72);transform:rotate(-1.2deg);pointer-events:none}
.a-top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.a-tags{display:flex;align-items:center;gap:18px}
.a-pill{display:inline-flex;align-items:center;min-height:40px;padding:0 20px;border:1.5px solid #B9AE9E;border-radius:999px;font-size:14px;font-weight:700;color:var(--body);background:#FBF9F3}
.a-pill .dot{width:8px;height:8px;margin-right:8px}
.a-no{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.08em;color:#8E847A}
.a-tools{display:flex;align-items:center;gap:14px;margin-left:auto}
.star{width:48px;height:48px;border:none;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#B9AE9E}
.star[aria-pressed="true"]{color:#D9A21B}
.star:hover{background:#F3EDE2}
.a-close{width:52px;height:52px;border:1.5px solid var(--ink);border-radius:50%;background:#FBF9F3;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.a-close:hover{background:#F3EDE2}
.a-title{margin:4px 0 0;font-size:36px;font-weight:900;line-height:1.25}
.a-sum{margin:-8px 0 0;font-size:15px;line-height:1.75;color:#8E7E6B;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.vers{display:flex;flex-wrap:wrap;gap:10px}
.ver{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:var(--ink);color:#FBF9F3;font-size:18px;font-weight:500}
.ruled{position:relative;border:1.5px dashed #B9AE9E;border-radius:14px;padding:0 26px;font-size:16px;line-height:44px;min-height:calc(44px * 8);max-height:52vh;overflow:auto;white-space:pre-wrap;word-break:break-word;color:var(--ink);background-color:#FDFCF8;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 43px,#E6DFD2 43px,#E6DFD2 44px);background-attachment:local}
.blank{font:inherit;color:var(--ink);font-weight:700;height:32px;line-height:32px;padding:0 6px;margin:0 2px;border:none;border-bottom:2px solid var(--accent);border-radius:6px 6px 0 0;background:rgba(247,228,138,.38);vertical-align:baseline;min-width:3em;max-width:100%}
.blank::placeholder{color:var(--danger);font-weight:500;opacity:.75}
.blank.filled{background:var(--yellow);border-bottom-color:var(--ink)}
.blank:focus{outline:none;box-shadow:0 0 0 3px #E2B93B}
.a-status{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted);min-height:24px}
.a-status .mono{font-size:13px}
.a-actions{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.pill{min-height:56px;padding:0 32px;border-radius:999px;font-size:19px;font-weight:500;box-shadow:4px 4px 0 var(--shadow)}
.pill.primary{background:var(--yellow)}
.tips-empty{color:var(--muted)}
.a-meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 18px;align-items:center;font-size:15px}
.a-meta dt{color:var(--muted)}
.a-meta dd{margin:0;display:flex;flex-wrap:wrap;gap:8px}
.members{display:flex;flex-wrap:wrap;gap:8px}
.member{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;font-size:14px}
.member[aria-pressed="true"]{background:#EFE3CB;font-weight:700}
.member .tick{width:16px;text-align:center;font-family:var(--mono)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;padding:3px 12px;border-radius:999px;border:1px solid #C9BBA6;color:var(--body)}
.tag.model{font-family:var(--mono);background:var(--ink);color:var(--bg);border-color:var(--ink)}
.input{min-height:46px;padding:0 14px;border:1.5px solid var(--ink);border-radius:12px;background:#fff;font-size:15px;width:100%}
textarea.input{padding:12px 14px;line-height:1.7;min-height:160px;resize:vertical}
.f-label{font-size:13px;color:var(--body);font-weight:500}

/* 表单弹窗 */
dialog.modal{width:min(600px,calc(100% - 32px));max-height:calc(100% - 48px);padding:0;border:1.5px solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:6px 6px 0 var(--shadow)}
dialog.modal[open]{animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.m-form{display:flex;flex-direction:column;gap:18px;padding:26px}
.m-title{margin:0;font-size:22px;font-weight:900}
.m-desc{margin:-8px 0 0;font-size:14px;color:var(--muted);line-height:1.7}
.m-row{display:flex;flex-direction:column;gap:8px}
.m-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.m-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding-top:6px}
.m-foot .right{display:flex;gap:10px;margin-left:auto}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radio{position:relative}
.radio input{position:absolute;opacity:0;inset:0;cursor:pointer}
.radio span{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1.5px solid var(--ink);border-radius:999px;background:var(--paper);font-size:15px}
.radio input:checked+span{background:var(--c);font-weight:700;box-shadow:3px 3px 0 var(--shadow)}
.radio input:focus-visible+span{outline:3px solid #E2B93B;outline-offset:2px}
.swatch span{width:44px;height:44px;padding:0;justify-content:center}
.swatch span i{width:16px;height:16px;border-radius:50%;background:var(--c)}
.swatch input:checked+span{background:var(--paper);box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.detected{font-size:13px;color:var(--muted);line-height:1.8}
.detected b{font-weight:500;color:var(--ink);border:1px dashed #7A6A58;border-radius:999px;padding:1px 8px;margin-right:4px;background:#fff}
.err{font-size:13px;color:var(--danger)}
.picks{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:6px;background:#fff}
.pick{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border-radius:10px;cursor:pointer;font-size:15px}
.pick:hover{background:#F3EDE2}
.pick input{width:18px;height:18px;accent-color:#4A3B2E}
.pick .no{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* 账户 */
.acct{position:fixed;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.menu{width:240px;padding:8px;background:var(--paper);border:1.5px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--shadow);display:flex;flex-direction:column;gap:2px}
.menu[hidden]{display:none}
.menu .who{padding:10px 12px 12px;border-bottom:1px dashed #D6CAB6;margin-bottom:4px}
.menu .who b{display:block;font-size:16px}
.menu .who span{font-size:13px;color:var(--muted)}
.menu a,.menu button{display:flex;align-items:center;min-height:44px;padding:0 12px;border:none;border-radius:10px;background:transparent;font-size:15px;text-align:left;cursor:pointer;color:var(--ink);text-decoration:none}
.menu a:hover,.menu button:hover{background:#EAE2D3}
.menu .out-btn{color:var(--danger)}
.avatar{width:56px;height:56px;padding:0;border:2px solid var(--ink);border-radius:50%;overflow:hidden;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);background:var(--paper)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:50;padding:12px 20px;border:1.5px solid var(--ink);border-radius:999px;background:var(--ink);color:var(--bg);font-size:15px;transition:opacity .2s, transform .2s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:720px){
  .page{padding:24px 16px 120px}
  .title{font-size:40px}
  .top{padding:0 20px;font-size:17px}
  .chip{min-height:44px;padding:0 16px;font-size:16px}
  .inner{padding:18px}
  dialog.archive{padding:40px 10px 64px}
  .stack{padding-right:40px}
  .peek-tab{width:40px;right:0;font-size:14px}
  .front{padding:30px 20px 26px}
  .clip{left:70px}
  .tape{right:70px;width:120px}
  .a-title{font-size:28px}
  .ruled{padding:0 14px;font-size:15px}
  .pill{padding:0 24px;font-size:17px}
  .m-two{grid-template-columns:minmax(0,1fr)}
  .kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="page">
<div class="wrap">

<header class="head">
  <div>
    <div class="eyebrow">PINPROMPT ARCHIVE STUDIO</div>
    <h1 class="title">提示词库</h1>
    <p class="sub">查找、填写并复制可直接使用的提示词。</p>
  </div>
  <button class="btn btn-new" type="button" data-act="new-prompt">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 2v12M2 8h12"/></svg>新建提示词
  </button>
</header>

<div class="search">
  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#4A3B2E" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="6.5"/><path d="M14 14l4.5 4.5"/></svg>
  <label for="q" class="sr">搜索</label>
  <input id="q" type="search" autocomplete="off" placeholder="搜索创作意图，例如：汽车广告、人像修图、九宫格分镜、可灵转场">
  <span class="kbd" aria-hidden="true">⌘ K</span>
</div>

<div>
  <nav class="tops" id="tops" aria-label="一级分类"></nav>
  <div class="panel" id="panel"></div>
</div>

<main id="content"></main>

</div>
</div>

<!-- 档案：双击卡片后打开 -->
<dialog class="archive" id="archive" aria-labelledby="a-title"></dialog>

<!-- 新建 / 编辑提示词 -->
<dialog class="modal" id="promptDlg" aria-labelledby="pf-title">
  <form class="m-form" id="promptForm" novalidate>
    <h2 class="m-title" id="pf-title">新建提示词</h2>
    <p class="m-desc">正文里用 {变量名} 标出需要每次填写的部分，例如：{产品}、{运镜}。</p>
    <div class="m-row"><label class="f-label" for="pf-name">标题</label><input class="input" id="pf-name" name="title" maxlength="60" required></div>
    <div class="m-row"><span class="f-label" id="pf-cat-l">类型</span><div class="radios" role="radiogroup" aria-labelledby="pf-cat-l" id="pf-cats"></div></div>
    <div class="m-two">
      <div class="m-row"><label class="f-label" for="pf-model">适用模型</label><input class="input" id="pf-model" name="model" placeholder="例如：Seedance"></div>
      <div class="m-row"><label class="f-label" for="pf-tags">标签</label><input class="input" id="pf-tags" name="tags" placeholder="用空格或逗号分隔"></div>
    </div>
    <div class="m-row"><label class="f-label" for="pf-body">提示词正文</label><textarea class="input" id="pf-body" name="body" required></textarea><div class="detected" id="pf-detected"></div></div>
    <div class="m-row"><label class="f-label" for="pf-tips">使用建议</label><textarea class="input" id="pf-tips" name="tips" style="min-height:96px" placeholder="例如：适合什么素材、参数怎么调、常见问题"></textarea></div>
    <div class="err" id="pf-err" role="alert"></div>
    <div class="m-foot">
      <button type="button" class="btn btn-sm danger" id="pf-delete" data-act="delete-prompt">删除提示词</button>
      <div class="right">
        <button type="button" class="btn btn-sm" data-act="close-dialog">取消</button>
        <button type="submit" class="btn btn-sm primary" id="pf-submit">保存</button>
      </div>
    </div>
  </form>
</dialog>

<!-- 新建项目 -->
<dialog class="modal" id="projectDlg" aria-labelledby="pj-title">
  <form class="m-form" id="projectForm" novalidate>
    <h2 class="m-title" id="pj-title">新建项目</h2>
    <p class="m-desc">把同一支片子要用到的提示词放在一起。</p>
    <div class="m-row"><label class="f-label" for="pj-name">项目名称</label><input class="input" id="pj-name" name="name" maxlength="40" required></div>
    <div class="m-row"><span class="f-label" id="pj-color-l">标记颜色</span><div class="radios" role="radiogroup" aria-labelledby="pj-color-l" id="pj-colors"></div></div>
    <div class="err" id="pj-err" role="alert"></div>
    <div class="m-foot"><div class="right">
      <button type="button" class="btn btn-sm" data-act="close-dialog">取消</button>
      <button type="submit" class="btn btn-sm primary">创建项目</button>
    </div></div>
  </form>
</dialog>

<!-- 向项目添加提示词 -->
<dialog class="modal" id="pickDlg" aria-labelledby="pk-title">
  <form class="m-form" id="pickForm">

    <p class="m-desc" id="pk-desc"></p>
    <div class="picks" id="pk-list"></div>
    <div class="m-foot"><div class="right">
      <button type="button" class="btn btn-sm" data-act="close-dialog">取消</button>
      <button type="submit" class="btn btn-sm primary">保存</button>
    </div></div>
  </form>
</dialog>

</dialog>

<script>
/* =====================================================================
   拼好词 PinPrompt · 提示词库 —— 交互说明
   ---------------------------------------------------------------------
   一级页面
   · 顶部「新建提示词」→ 打开新建弹窗；在某个项目里点时，新建的提示词自动归入该项目
   · 搜索框：实时过滤标题 / 正文 / 标签 / 模型；⌘K（Ctrl+K）聚焦；Esc 清空
   · 一级标签「提示词 / 项目」切换；二级标签「全部类型 / 图片 / 视频 / 文本 / 音乐」筛选
   · 卡片：单击 = 选中（卡片浮起）；双击 = 打开档案
           触屏设备单击即打开；键盘聚焦卡片后按 Enter 打开
           右下按钮：有变量时「填写 · N 项」→ 打开档案；无变量时「复制」→ 直接复制
   档案（叠放纸张弹层，居中出现，不在一级页面里常驻）
   · 顶部：类型 · 版本标签、编号、收藏星标（收藏的卡片编号旁显示 ★）、关闭
   · 正文写在横线信纸框里；{变量} 直接变成纸上的填空，边填边看；填写内容按提示词记住
   · 底部：复制提示词（未填的空保留 {占位}）、编辑
   · 右侧露出的「使用建议 · TIPS」纸：点它换到前面，查看使用建议、适用模型、标签、所属项目（可加入 / 移出）
     再点右侧「提示词 · PROMPT」换回
   · 关闭：右上 ×、点遮罩、Esc；关闭后焦点回到原卡片
   项目
   · 项目列表：点「打开项目」进入项目页；「新建项目」→ 弹窗（名称 + 颜色）
   · 项目页：返回全部项目、管理提示词（勾选列表）、删除项目（二次确认，不删除提示词本身）
   编辑弹窗：可删除提示词（二次确认，同时从所有项目里移出）
   左下角头像：展开账户菜单（返回学习站 / 账号设置 / 退出登录）；点外部或 Esc 收起
   数据保存在浏览器 localStorage（键名 pinprompt-studio-v1），接入后端时替换 load()/save()
   ===================================================================== */

const STORE_KEY = 'pinprompt-studio-v1';
const CATS = [
  { id: 'image', name: '图片', tint: 'var(--img)', dot: 'var(--img-dot)' },
  { id: 'video', name: '视频', tint: 'var(--vid)', dot: 'var(--vid-dot)' },
  { id: 'text',  name: '文本', tint: 'var(--txt)', dot: 'var(--txt-dot)' },
  { id: 'music', name: '音乐', tint: 'var(--mus)', dot: 'var(--mus-dot)' }
];
const PROJECT_COLORS = ['#E8508A', '#E5484D', '#F29A1F', '#2E8B5E', '#3D6FB6', '#8058B8'];
const SEED = {
  prompts: [
    { id: '001', cat: 'image', version: '通用版', title: '基础人物去油提示词', model: 'GPT-IMAGE-2', tags: ['人像修图', '去油'], tips: '', body: '{\n  "subject": "portrait of a woman",\n  "skin_texture": "matte velvet skin, subtle skin pores, refined texture",\n  "lighting": "soft side lighting, cinematic atmosphere, no greasy reflections",\n  "makeup": "matte foundation",\n  "style": "photorealistic, 8k, high detailed"\n}' },
    { id: '002', cat: 'text', title: '[文本提示词标题]', model: '[适用模型]', tags: ['文本'], body: '[提示词正文]' },
    { id: '003', cat: 'image', title: '照片修复-GPT-IMAGE-2', model: 'GPT-IMAGE-2', tags: ['老照片', '修复'], body: '修复这张{年代}的老照片：去除划痕、折痕与噪点，补全缺损部分，{上色方式}，保持人物面部特征真实，输出高清细节。' },

    { id: '005', cat: 'image', title: '涂鸦画笔', model: 'GPT-IMAGE-2', tags: ['风格化', '手绘'], body: '把画面中的{对象}用{颜色}蜡笔涂鸦风格勾勒描边，线条松散、带手绘抖动感，叠加少量涂鸦符号，背景保持原样。' },
    { id: '006', cat: 'video', title: 'image2 + seedance 流程作业', model: 'GPT-IMAGE-2 → Seedance', tags: ['产品视频'], body: '第一步：用 GPT-IMAGE-2 生成{产品}的{数量}张关键帧，统一光线与色调。第二步：将关键帧导入 Seedance，运镜方式为{运镜}，每段 5 秒，保持主体一致。' },
    { id: '007', cat: 'image', title: '真实人物皮肤质感', model: 'GPT-IMAGE-2', tags: ['人像', '写实'], body: '超写实人像特写，{光线}，清晰可见毛孔、细小绒毛与轻微瑕疵，皮肤带自然油脂反光，85mm 镜头，浅景深。' },
    { id: '008', cat: 'video', title: '分屏视频提示词', model: 'Seedance', tags: ['分屏', '对比'], body: '画面左右分屏：左侧为{场景A}，右侧为{场景B}，两侧动作同步进行，中间一条细白分隔线，镜头固定，节奏{节奏}。' },
    { id: '009', cat: 'image', title: '面部去油-面部细节增强', model: 'GPT-IMAGE-2', tags: ['人像修图', '精修'], body: '对{人物}面部做精修：去除 T 区油光，增强眉毛、睫毛与唇纹细节，保留皮肤原有质感，整体{风格}。' },
    { id: '010', cat: 'video', title: 'Seedance高级丝绸广告大片', model: 'Seedance', tags: ['广告', '质感'], body: '{颜色}丝绸在空中缓慢翻卷，柔光掠过布料褶皱，微距镜头跟随流动，背景纯净，质感奢华，适合{品牌类型}广告开场。' },

  projects: [

    { id: 'p3', name: '渝ba', dot: '#F29A1F', items: [] }
  ],
  vals: {}

/* ---------- 数据读写 ---------- */
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.prompts) && Array.isArray(d.projects)) return Object.assign({ vals: {} }, d); }
  } catch (e) {}
  return JSON.parse(JSON.stringify(SEED));
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch (e) {} }
const db = window.parent === window ? load() : { prompts: [], projects: [], vals: {} };

/* ---------- 状态 ---------- */
const state = { top: 'prompt', cat: 'any', q: '', projectId: null, openId: null, selectedId: null, sheet: 'prompt', swapAnim: false, editId: null, copiedId: null };

/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const catOf = id => CATS.find(c => c.id === id) || CATS[0];
const VAR_RE = /\{\{([^{}\n"':,]{1,20})\}\}|\{([^{}\n"':,]{1,20})\}/g;
const varsOf = body => [...new Set([...String(body).matchAll(VAR_RE)].map(m => (m[1] || m[2]).trim()).filter(Boolean))];
const vkey = (id, name) => id + '::' + name;
const valOf = (id, name) => (db.vals[vkey(id, name)] || '').trim();
const assemble = p => p.body.replace(VAR_RE, (all, double, single) => valOf(p.id, (double || single).trim()) || all);
const getPrompt = id => db.prompts.find(p => p.id === id);
const getProject = id => db.projects.find(p => p.id === id);
let nextId = () => crypto.randomUUID();
const archiveNo = p => String(db.prompts.indexOf(p) + 1).padStart(3, '0');
const matchQ = p => { const q = state.q.trim().toLowerCase(); return !q || (p.title + ' ' + p.body + ' ' + p.tags.join(' ') + ' ' + p.model).toLowerCase().includes(q); };

let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- 一级 / 二级标签 ---------- */
function renderTabs() {
  const tops = [
    { id: 'prompt', name: '提示词', tab: '#FBF1C4', count: db.prompts.length },
    { id: 'project', name: '项目', tab: '#EFE3CB', count: db.projects.length }
  ];
  const active = tops.find(t => t.id === state.top);
  $('tops').innerHTML = tops.map(t =>
    `<button type="button" class="top" data-act="top" data-id="${t.id}" aria-pressed="${t.id === state.top}" style="--tab:${t.tab}">${t.name}<span class="n">${t.count}</span></button>`).join('');
  const panel = $('panel');
  panel.style.setProperty('--tab', active.tab);
  if (state.top === 'prompt') {
    const subs = [{ id: 'any', name: '全部类型', tint: 'var(--yellow)', dot: 'conic-gradient(var(--img-dot) 0 25%, var(--vid-dot) 0 50%, var(--txt-dot) 0 75%, var(--mus-dot) 0)' }].concat(CATS);
    panel.innerHTML = `<div class="subs" role="group" aria-label="内容类型">` + subs.map(s => {
      const n = s.id === 'any' ? db.prompts.length : db.prompts.filter(p => p.cat === s.id).length;
      return `<button type="button" class="btn chip${n ? '' : ' zero'}" data-act="cat" data-id="${s.id}" aria-pressed="${s.id === state.cat}" style="--c:${s.tint}"><span class="dot" style="background:${s.dot}" aria-hidden="true"></span>${s.name}<span class="n">${n}</span></button>`;

  }
}

/* ---------- 卡片 ---------- */
function cardHTML(p) {
  const c = catOf(p.cat), vars = varsOf(p.body), copied = state.copiedId === p.id;
  const label = copied ? '已复制 ✓' : (vars.length ? `填写 · ${vars.length} 项` : '复制');
  return `
    <article class="card${state.selectedId === p.id ? ' sel' : ''}" data-card="${p.id}" style="--c:${c.tint}">
      <div class="ear">${archiveNo(p)}${p.fav ? '<span class="fav" aria-label="已收藏">★</span>' : ''}</div>
      <div class="sheet">
        <button type="button" class="card-title" data-act="open" data-id="${p.id}" aria-describedby="open-hint">${esc(p.title)}</button>
        <p class="preview">${esc(p.body.replace(VAR_RE, (_, double, single) => `「${double || single}」`).replace(/\s+/g, ' '))}</p>
        ${vars.length ? `<div class="vars">${vars.map(v => `<span class="var">${esc(v)}</span>`).join('')}</div>` : ''}
        <div class="foot">
          <span class="foot-meta"><span class="dot" style="width:8px;height:8px;background:${c.dot}" aria-hidden="true"></span><span>${c.name} · ${esc(p.model || '未注明模型')}</span></span>
          <button type="button" class="btn quick ${copied ? 'done' : (vars.length ? '' : 'go')}" data-act="quick" data-id="${p.id}" aria-label="${vars.length ? '填写' + esc(p.title) : '复制' + esc(p.title)}">${label}</button>
        </div>
      </div>
    </article>`;
}

/* ---------- 内容区 ---------- */
function renderContent() {
  const el = $('content');

  if (state.top === 'prompt') {
    const list = db.prompts.filter(p => (state.cat === 'any' || p.cat === state.cat) && matchQ(p));

    return;
  }

  const pj = state.projectId && getProject(state.projectId);

      <div class="proj-head">

        </div>

        </div>
      </div>
      <div class="meta"><div>共 <strong>${list.length}</strong> 份档案</div></div>
      ${items.length === 0
        ? `<div class="empty">这个项目还没有提示词。<button type="button" class="btn btn-sm primary" data-act="pick">从提示词库添加</button></div>`
        : list.length ? `<div class="grid">${list.map(cardHTML).join('')}</div>` : `<div class="empty">项目里没有匹配的提示词。</div>`}`;

        <div class="ear"></div>
        <div class="sheet">
          <span class="pdot" style="background:${pj.dot}" aria-hidden="true"></span>

          <div class="count">${n ? n + ' 份档案' : '空项目，可从提示词库添加'}</div>
          <button type="button" class="btn btn-sm open" data-act="open-project" data-id="${pj.id}">打开项目</button>
        </div>
      </article>`;
  }).join('') + `
    <button type="button" class="btn newproj" data-act="new-project">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="10"/><path d="M20 12v16M12 20h16"/></svg>新建项目
    </button></section>`;
}

function render() { renderTabs(); renderContent(); }

/* ---------- 弹层通用 ---------- */
const returnFocus = new Map();
function openDialog(dlg) {
  returnFocus.set(dlg, document.activeElement);
  dlg.showModal();
  document.body.classList.add('locked');
}
document.querySelectorAll('dialog').forEach(dlg => {
  dlg.addEventListener('close', () => {
    if (!document.querySelector('dialog[open]')) document.body.classList.remove('locked');
    const back = returnFocus.get(dlg);
    if (dlg.id === 'archive') { state.openId = null; refocusCard(back); }
    else if (back && document.contains(back)) back.focus();
  });
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
});
let lastOpenedId = null;
function refocusCard(back) {
  const btn = lastOpenedId && document.querySelector(`.card-title[data-id="${lastOpenedId}"]`);
  (btn || (back && document.contains(back) ? back : null))?.focus();
}

/* ---------- 档案（叠放纸张） ---------- */
function openArchive(id) {
  state.openId = id; state.selectedId = id; state.sheet = 'prompt'; state.swapAnim = false; lastOpenedId = id;
  renderArchive();
  const dlg = $('archive');
  if (!dlg.open) openDialog(dlg);
  dlg.scrollTop = 0;
  $('a-close').focus();
}
const ICON_CLOSE = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 2l12 12M14 2L2 14"/></svg>';
const ICON_STAR = '<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>';
const ICON_CLIP = '<svg class="clip" viewBox="0 0 30 66" fill="none" stroke="#8E847A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M14 2c-6 8 10 12 4 22-4 7-12 6-8 16 3 7 10 6 8 14-1 4-5 6-9 10"/></svg>';

function renderArchive() {
  const p = getPrompt(state.openId);
  if (!p) { if ($('archive').open) $('archive').close(); return; }
  const c = catOf(p.cat), ver = p.version || '通用版', tips = state.sheet === 'tips';
  const head = `
    <div class="a-top">
      <div class="a-tags"><span class="a-pill"><span class="dot" style="background:${c.dot}" aria-hidden="true"></span>${c.name} · ${esc(ver)}</span><span class="a-no">NO.${archiveNo(p)}</span></div>
      <div class="a-tools">
        <button type="button" class="star" data-act="star" aria-pressed="${!!p.fav}" aria-label="${p.fav ? '取消收藏' : '收藏'}">${ICON_STAR}</button>
        <button type="button" class="a-close" id="a-close" data-act="close-archive" aria-label="关闭档案">${ICON_CLOSE}</button>
      </div>
    </div>`;
  $('archive').innerHTML = `
    <div class="stack">
      <div class="paper b1" aria-hidden="true"><span class="stamp">PINPROMPT 档案</span></div>
      <div class="paper b2" aria-hidden="true"></div>
      <div class="paper peek"><button type="button" class="peek-tab" data-act="swap-sheet" aria-label="${tips ? '换回提示词' : '查看使用建议'}">${tips ? '提示词 · PROMPT' : '使用建议 · TIPS'}</button></div>
      <article class="paper front${state.swapAnim ? ' swap' : ''}">
        ${ICON_CLIP}<span class="tape" aria-hidden="true"></span>
        ${head}
        ${tips ? tipsSheet(p) : promptSheet(p, ver)}
      </article>
    </div>`;
  state.swapAnim = false;
  refreshFill();
}

function promptSheet(p, ver) {
  const vars = varsOf(p.body);
  const parts = p.body.split(/(\{\{[^{}\n"':,]{1,20}\}\}|\{[^{}\n"':,]{1,20}\})/).filter(Boolean);
  const paper = parts.map(s => {
    const m = s.match(/^(?:\{\{([^{}\n"':,]{1,20})\}\}|\{([^{}\n"':,]{1,20})\})$/);
    if (!m) return esc(s);
    const name = (m[1] || m[2]).trim(), v = db.vals[vkey(p.id, name)] || '';
    return `<input class="blank${v.trim() ? ' filled' : ''}" data-var="${esc(name)}" value="${esc(v)}" placeholder="${esc(name)}" aria-label="填写${esc(name)}" autocomplete="off" style="width:${blankWidth(v, name)}">`;
  }).join('');
  return `
    <h2 class="a-title" id="a-title">${esc(p.title)}</h2>
    <p class="a-sum">${esc(p.body.replace(/\s+/g, ' '))}</p>
    <div class="vers"><span class="ver">${esc(ver)}</span></div>
    <div class="ruled" id="a-paper">${paper}</div>
    <div class="a-status"><span id="a-progress">${vars.length ? '' : '没有需要填写的空，可以直接复制。'}</span>${vars.length ? '<button type="button" class="btn-ghost" data-act="clear-vals" style="min-height:32px">清空填写</button>' : ''}</div>
    <div class="a-actions">
      <button type="button" class="btn pill primary" id="a-copy" data-act="copy" data-id="${p.id}">复制提示词</button>
      <button type="button" class="btn pill" data-act="edit-prompt" data-id="${p.id}">编辑</button>
    </div>`;
}

function tipsSheet(p) {
  return `
    <h2 class="a-title" id="a-title">使用建议</h2>
    <p class="a-sum">${esc(p.title)}</p>
    <div class="ruled" style="min-height:calc(44px * 5)">${p.tips ? esc(p.tips) : '<span class="tips-empty">还没有使用建议。点「编辑」补充适合的素材、参数和注意事项。</span>'}</div>
    <dl class="a-meta">
      <dt>适用模型</dt><dd><span class="tag model">${esc(p.model || '未注明')}</span></dd>
      <dt>标签</dt><dd>${p.tags.length ? p.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join('') : '<span class="tips-empty">无</span>'}</dd>
      <dt>所属项目</dt><dd>${db.projects.length ? `<div class="members">${db.projects.map(pj => {
        const on = pj.items.includes(p.id);
        return `<button type="button" class="btn member" data-act="toggle-member" data-id="${pj.id}" aria-pressed="${on}"><span class="dot" style="background:${pj.dot}" aria-hidden="true"></span>${esc(pj.name)}<span class="tick" aria-hidden="true">${on ? '✓' : '+'}</span></button>`;
      }).join('')}</div>` : '<span class="tips-empty">还没有项目</span>'}</dd>
    </dl>
    <div class="a-actions"><button type="button" class="btn pill" data-act="edit-prompt" data-id="${p.id}">编辑</button></div>`;
}

const blankWidth = (v, name) => (Math.max([...(v || '')].length, [...name].length) + 1.6) + 'em';

/* 只刷新状态文字，填空时不会丢焦点 */
function refreshFill() {
  const p = getPrompt(state.openId);
  if (!p || state.sheet !== 'prompt' || !$('a-copy')) return;
  const vars = varsOf(p.body);
  const filled = vars.filter(v => valOf(p.id, v)).length;
  if (vars.length) {
    const left = vars.length - filled;
    $('a-progress').innerHTML = `<span class="mono">已填 ${filled} / ${vars.length}</span>${left ? `　还有 ${left} 个空，复制时会保留 {占位}` : '　全部填好了'}`;
  }
  const copied = state.copiedId === p.id;
  $('a-copy').textContent = copied ? '已复制 ✓' : '复制提示词';
  $('a-copy').classList.toggle('done', copied);
}

/* ---------- 复制 ---------- */
let copyTimer;
async function copyPrompt(p) {
  const text = assemble(p);
  let ok = true;
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
    ta.remove();
  }
  if (!ok) { toast('复制失败，请手动选中预览文字复制'); return; }
  state.copiedId = p.id;
  renderContent(); refreshFill();
  toast('已复制到剪贴板');
  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => { state.copiedId = null; renderContent(); refreshFill(); }, 1600);
}

/* ---------- 新建 / 编辑提示词 ---------- */
function openPromptForm(id) {
  const p = id ? getPrompt(id) : null;
  state.editId = p ? p.id : null;
  $('pf-title').textContent = p ? `编辑提示词 ${archiveNo(p)}` : '新建提示词';
  $('pf-submit').textContent = p ? '保存修改' : '保存';
  $('pf-delete').hidden = !p;
  const defCat = p ? p.cat : (state.top === 'prompt' && state.cat !== 'any' ? state.cat : 'image');
  $('pf-cats').innerHTML = CATS.map(c =>
    `<label class="radio" style="--c:${c.tint}"><input type="radio" name="cat" value="${c.id}"${c.id === defCat ? ' checked' : ''}><span><i class="dot" style="background:${c.dot}"></i>${c.name}</span></label>`).join('');
  $('pf-name').value = p ? p.title : '';
  $('pf-model').value = p ? p.model : '';
  $('pf-tags').value = p ? p.tags.join(' ') : '';
  $('pf-body').value = p ? p.body : '';
  $('pf-tips').value = p ? (p.tips || '') : '';
  $('pf-err').textContent = '';
  updateDetected();
  openDialog($('promptDlg'));
  $('pf-name').focus();
}
function updateDetected() {
  const vars = varsOf($('pf-body').value);
  $('pf-detected').innerHTML = vars.length ? '识别到变量：' + vars.map(v => `<b>${esc(v)}</b>`).join('') : '还没有变量。没有变量的提示词在列表里可以一键复制。';
}
$('pf-body').addEventListener('input', updateDetected);
$('promptForm').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  const el = f.elements;
  const title = el.title.value.trim(), body = el.body.value.trim();
  if (!title || !body) { $('pf-err').textContent = !title ? '请填写标题。' : '请填写提示词正文。'; (!title ? el.title : el.body).focus(); return; }
  const data = {
    title, body,
    cat: el.cat.value || 'image',
    model: el.model.value.trim(),
    tips: el.tips.value.trim(),
    tags: el.tags.value.split(/[\s,，、]+/).map(s => s.trim()).filter(Boolean)
  };
  if (state.editId) {
    Object.assign(getPrompt(state.editId), data);
    toast('已保存修改');
  } else {
    const p = Object.assign({ id: nextId() }, data);
    db.prompts.push(p);
    const pj = state.top === 'project' && state.projectId && getProject(state.projectId);
    if (pj) pj.items.push(p.id);
    toast(pj ? `已新建并加入「${pj.name}」` : `已新建提示词 ${archiveNo(p)}`);
  }
  save();
  $('promptDlg').close();
  render();
  if ($('archive').open) renderArchive();
});

async function deletePrompt() {
  const p = getPrompt(state.editId);
  if (!p) return;
  const ok = await confirmAsk('删除这条提示词？', `「${p.title}」会从提示词库和所有项目里移除，无法恢复。`, '删除');
  if (!ok) return;
  db.prompts = db.prompts.filter(x => x.id !== p.id);
  db.projects.forEach(pj => { pj.items = pj.items.filter(i => i !== p.id); });
  Object.keys(db.vals).forEach(k => { if (k.startsWith(p.id + '::')) delete db.vals[k]; });
  save();
  $('promptDlg').close();
  if ($('archive').open) $('archive').close();
  render();
  toast('已删除');
}

/* ---------- 二次确认 ---------- */
function confirmAsk(title, desc, okLabel) {
  return new Promise(resolve => {
    const dlg = $('confirmDlg');
    $('cf-title').textContent = title;
    $('cf-desc').textContent = desc;
    $('cf-ok').textContent = okLabel || '确定';
    dlg.returnValue = '';
    dlg.addEventListener('close', () => resolve(dlg.returnValue === 'ok'), { once: true });
    openDialog(dlg);
    dlg.querySelector('button[value="cancel"]').focus();
  });
}

/* ---------- 账户菜单 ---------- */
const avatar = $('avatar'), menu = $('menu');
function setMenu(open) {
  menu.hidden = !open;
  avatar.setAttribute('aria-expanded', String(open));
  if (open) menu.querySelector('a,button').focus();
}

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!menu.hidden && !e.target.closest('.acct')) setMenu(false);
  if (!t) return;
  const id = t.dataset.id;
  switch (t.dataset.act) {
    case 'top': state.top = id; if (id === 'prompt') state.projectId = null; render(); break;
    case 'cat': state.cat = id; render(); break;
    case 'open':
      /* 键盘触发（detail 为 0）或触屏单击 → 直接打开；鼠标单击 → 选中 */
      if (e.detail === 0 || lastPointer === 'touch') openArchive(id);
      else selectCard(id);
      break;
    case 'quick': {
      const p = getPrompt(id);
      varsOf(p.body).length ? openArchive(id) : copyPrompt(p);
      break;
    }
    case 'close-archive': $('archive').close(); break;
    case 'star': {
      const p = getPrompt(state.openId);
      p.fav = !p.fav; save(); renderArchive(); renderContent();
      $('archive').querySelector('.star').focus();
      toast(p.fav ? '已收藏' : '已取消收藏');
      break;
    }
    case 'swap-sheet':
      state.sheet = state.sheet === 'tips' ? 'prompt' : 'tips'; state.swapAnim = true;
      renderArchive();
      $('archive').querySelector('.peek-tab').focus();
      break;
    case 'copy': copyPrompt(getPrompt(id)); break;
    case 'clear-vals': {
      const p = getPrompt(state.openId);
      varsOf(p.body).forEach(v => delete db.vals[vkey(p.id, v)]);
      save(); renderArchive();
      break;
    }
    case 'toggle-member': {
      const pj = getProject(id), pid = state.openId;
      const on = pj.items.includes(pid);
      pj.items = on ? pj.items.filter(i => i !== pid) : pj.items.concat(pid);
      save(); renderArchive(); render();
      $('archive').querySelector(`[data-act="toggle-member"][data-id="${id}"]`)?.focus();
      toast(on ? `已移出「${pj.name}」` : `已加入「${pj.name}」`);
      break;
    }
    case 'new-prompt': openPromptForm(null); break;
    case 'edit-prompt': openPromptForm(id); break;
    case 'delete-prompt': deletePrompt(); break;
    case 'close-dialog': t.closest('dialog').close(); break;
    case 'new-project': openProjectForm(); break;
    case 'open-project': state.projectId = id; render(); $('content').querySelector('.proj-name')?.scrollIntoView({ block: 'nearest' }); break;
    case 'back-projects': state.projectId = null; render(); break;
    case 'pick': openPicker(); break;
    case 'delete-project': deleteProject(); break;
    case 'account-settings': setMenu(false); toast('账号设置页待接入'); break;
    case 'logout':
      setMenu(false);
      confirmAsk('退出登录？', '退出后需要重新登录才能同步你的提示词。', '退出登录').then(ok => { if (ok) toast('已退出登录'); });
      break;
  }
});
avatar.addEventListener('click', e => { e.stopPropagation(); setMenu(menu.hidden); });

/* 卡片：单击选中，双击打开 */
let lastPointer = 'mouse';
document.addEventListener('pointerdown', e => { lastPointer = e.pointerType || 'mouse'; }, true);
function selectCard(id) {
  state.selectedId = id;
  document.querySelectorAll('.card[data-card]').forEach(c => c.classList.toggle('sel', c.dataset.card === id));
}
document.addEventListener('dblclick', e => {
  const t = e.target.closest('.card-title[data-act="open"]');
  if (t) { e.preventDefault(); openArchive(t.dataset.id); }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') { state.q = e.target.value; renderContent(); }
  else if (e.target.dataset.var && state.openId) {
    const name = e.target.dataset.var, v = e.target.value;
    db.vals[vkey(state.openId, name)] = v;
    e.target.style.width = blankWidth(v, name);
    e.target.classList.toggle('filled', !!v.trim());
    save(); refreshFill();
  }
});

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (document.querySelector('dialog[open]')) return;
    $('q').focus(); $('q').select();
  }
  if (e.key === 'Escape') {
    if (!menu.hidden) { setMenu(false); avatar.focus(); }
    else if (document.activeElement === $('q') && $('q').value) { $('q').value = ''; state.q = ''; renderContent(); }
  }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.var) {
    const inputs = [...$('archive').querySelectorAll('[data-var]')];
    const i = inputs.indexOf(e.target);
    if (i > -1 && i < inputs.length - 1) { e.preventDefault(); inputs[i + 1].focus(); }
  }
});

render();
</script>
<script src="/october/studio-bridge.js"></script>
</body>
